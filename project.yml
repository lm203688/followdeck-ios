# XcodeGen project spec for FollowDeck.
# The .xcodeproj is generated on the macOS CI runner at build time; it is NOT committed.
# Docs: https://github.com/yonaskolb/XcodeGen
# Regenerate locally (macOS only): `xcodegen generate`

name: FollowDeck

options:
  bundleIdPrefix: com.lmx203688
  deploymentTarget:
    iOS: "17.0"
  # Keep the generated project generic; app-specific entitlements are added in M1.
  developmentLanguage: en

settings:
  MARKETING_VERSION: "0.1.0"
  CURRENT_PROJECT_VERSION: "1"
  SWIFT_VERSION: "5.0"
  ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  FollowDeck:
    type: application
    platform: iOS
    sources:
      - path: FollowDeck/Sources/FollowDeck
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lmx203688.followdeck
      INFOPLIST_FILE: FollowDeck/Sources/FollowDeck/Info.plist
      TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_STYLE: Swift
    # Extensions (widget, share sheet) are added here in M1 once the MVP target builds.
    dependencies: []

  FollowDeckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FollowDeck/Tests/FollowDeckTests
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FollowDeck

schemes:
  FollowDeck:
    build:
      targets:
        FollowDeck: [run]
    test:
      targets:
        - FollowDeckTests
