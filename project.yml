# XcodeGen project spec for FollowDeck.
# The .xcodeproj is generated on the macOS CI runner at build time; it is NOT committed.
# Docs: https://github.com/yonaskolb/XcodeGen
# Regenerate locally (macOS only): `xcodegen generate`

name: FollowDeck

options:
  bundleIdPrefix: com.lixing
  deploymentTarget:
    iOS: "17.0"
  # Keep the generated project generic; app-specific entitlements are added in M1.
  developmentLanguage: en

settings:
  MARKETING_VERSION: "0.1.0"
  CURRENT_PROJECT_VERSION: "1"
  SWIFT_VERSION: "5.0"
  ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  FollowDeck:
    type: application
    platform: iOS
    sources:
      - path: FollowDeck/Sources/FollowDeck
      - path: FollowDeck/Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lixing.followdeck
      INFOPLIST_FILE: FollowDeck/Sources/FollowDeck/Info.plist
      CODE_SIGN_ENTITLEMENTS: FollowDeck/Sources/FollowDeck/FollowDeck.entitlements
      TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_STYLE: Swift
    dependencies:
      - target: FollowDeckWidget
        embed: true
        link: false

  FollowDeckWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: FollowDeck/Widgets/FollowDeckWidget
      - path: FollowDeck/Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lixing.followdeck.widget
      INFOPLIST_FILE: FollowDeck/Widgets/FollowDeckWidget/Info.plist
      CODE_SIGN_ENTITLEMENTS: FollowDeck/Widgets/FollowDeckWidget/FollowDeckWidget.entitlements
      GENERATE_INFOPLIST_FILE: NO
      TARGETED_DEVICE_FAMILY: "1,2"
      CODE_STYLE: Swift
    dependencies: []

  FollowDeckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FollowDeck/Tests/FollowDeckTests
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FollowDeck

schemes:
  FollowDeck:
    build:
      targets:
        FollowDeck: [run]
    test:
      targets:
        - FollowDeckTests
