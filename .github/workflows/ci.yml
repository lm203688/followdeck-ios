name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "Pipeline mode"
        required: true
        default: compile
        type: choice
        options:
          - compile   # build + unit tests on the simulator, no signing
          - dry_run   # build, sign, upload to TestFlight; do not submit (needs signing secrets)
          - inspect   # read-only ASC state dump via the official REST API (needs ASC API key)
          - prepare   # create/reuse the draft version and associate the VALID build; do not submit
          - attach-screenshots  # fetch CI screenshot artifacts internally and attach Pro paywall review screenshots
          - release   # sign, upload and submit for review (needs signing secrets)

env:
  SCHEME: FollowDeck

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate structure & secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required paths exist
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            "project.yml" \
            "FollowDeck/Sources/FollowDeck/Info.plist" \
            "FollowDeck/Sources/FollowDeck/Models/Models.swift" \
            "FollowDeck/Sources/FollowDeck/Services/Store.swift" \
            "FollowDeck/Sources/FollowDeck/App/FollowDeckApp.swift" \
            "Scripts/asc_submit.py" \
            "README.md"; do
            test -f "$p" || { echo "Missing required path: $p"; exit 1; }
          done

      - name: Scan for committed secrets
        shell: bash
        run: |
          set -euo pipefail
          # Token prefixes are split (e.g. gh[p]_) so this workflow file's own
          # example patterns do not self-match. .github is excluded for the same reason.
          if grep -RInE --exclude-dir=.git \
            -e "BEGIN [A-Z ]*PRIVATE KEY" \
            -e "github_[p]at_[A-Za-z0-9_]{20,}" \
            -e "gh[p]_[A-Za-z0-9]{20,}" \
            -e "gh[o]_[A-Za-z0-9]{20,}" \
            -e "-----BEGIN" \
            FollowDeck project.yml 2>/dev/null; then
            echo "::error::Possible secret committed to source. Remove it before merging."
            exit 1
          fi
          echo "No obvious secret patterns in source."

      - name: App icon must be opaque 1024 (ITMS-90717)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct, sys
          path = "FollowDeck/Sources/FollowDeck/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          data = open(path, "rb").read()
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              sys.exit("::error::AppIcon is not a PNG")
          w, h, depth, ctype = struct.unpack(">IIBB", data[16:26])
          # colour types with an alpha channel / palette transparency are rejected by ASC
          bad = []
          if ctype in (4, 6):
              bad.append(f"alpha colour type {ctype}")
          if b"tRNS" in data:
              bad.append("tRNS transparency chunk")
          if (w, h) != (1024, 1024):
              bad.append(f"size {w}x{h} != 1024x1024")
          if bad:
              sys.exit("::error::Invalid large app icon (ITMS-90717): " + ", ".join(bad))
          print(f"AppIcon OK: {w}x{h}, colour type {ctype} (no alpha)")
          PY

      - name: Validate YAML
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, yaml, sys
          ok = True
          for f in glob.glob(".github/workflows/*.yml") + ["project.yml"]:
              try:
                  yaml.safe_load(open(f, encoding="utf-8"))
                  print("valid:", f)
              except Exception as e:
                  print("invalid:", f, e); ok = False
          sys.exit(0 if ok else 1)

  asc-inspect:
    name: ASC inspect (read-only)
    runs-on: ubuntu-latest
    # Read-only state dump through the official ASC REST API. Does not build, sign,
    # upload or submit anything; only verifies the stored API key and reads state.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'inspect'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read-only ASC state dump
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_APP_ID: "6838357401"
        run: python3 Scripts/asc_submit.py inspect

  asc-prepare:
    name: ASC prepare draft version
    runs-on: ubuntu-latest
    # Creates/reuses the in-flight draft version and associates the target VALID build.
    # Does not fill localization/screenshots and does NOT submit for review.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'prepare'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare draft version and associate build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_APP_ID: "6838357401"
          TARGET_VERSION: "1.1"
          TARGET_BUILD: "4"
        run: python3 Scripts/asc_submit.py prepare

  asc-attach-screenshots:
    name: ASC attach Pro review screenshots
    runs-on: ubuntu-latest
    # Fetches the screenshot artifacts from inside the GitHub network (bypassing
    # any local Blob download) and attaches the yearly/monthly paywall frames to
    # the two Pro subscriptions' review screenshots. Does not submit for review.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'attach-screenshots'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Attach paywall review screenshots
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_APP_ID: "6838357401"
          ARTIFACT_IPHONE: "15027283002"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 Scripts/asc_submit.py attach-screenshots

  macos-build:
    name: macOS build (${{ github.event.inputs.action || 'compile' }})
    # Xcode 27 toolchain: App Store Connect rejects iOS 26 SDK builds from April 2027
    # (ITMS-90725), so shipping builds must use the iOS 27 SDK.
    runs-on: xcode-27
    timeout-minutes: 90
    # dry_run / release require signing secrets; compile runs on every push.
    if: github.event_name != 'pull_request' || github.event.inputs.action == ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest usable Xcode
        run: |
          set -euo pipefail
          chosen=""
          # List every installed Xcode*.app, prefer the one whose toolchain is intact, newest first.
          for app in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -Vr); do
            if [ -d "$app/Contents/Developer" ]; then chosen="$app"; break; fi
          done
          if [ -z "$chosen" ]; then
            echo "::error::No usable Xcode toolchain. Installed:"; ls /Applications | grep -i xcode; exit 1
          fi
          echo "Selected: $chosen"
          sudo xcode-select -s "$chosen/Contents/Developer"
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK"
          case "$SDK" in
            27.*|28.*|29.*) ;;
            *) echo "::error::iOS SDK $SDK is below 27.0 — App Store Connect rejects this from April 2027 (ITMS-90725)."; exit 1 ;;
          esac

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version; exit 0
          fi
          if command -v brew >/dev/null 2>&1; then
            brew install xcodegen && xcodegen --version && exit 0
          fi
          # Self-hosted runner without Homebrew: use the portable release binary.
          mkdir -p "$RUNNER_TEMP/xcodegen" "$HOME/.local/bin"
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q -o "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          bin=$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen -perm -u+x | head -1)
          test -n "$bin" || { echo "::error::xcodegen binary not found in release archive"; exit 1; }
          cp "$bin" "$HOME/.local/bin/xcodegen"
          chmod +x "$HOME/.local/bin/xcodegen"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/xcodegen" --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick newest available iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          name=$(xcrun simctl list devices available \
            | grep -oE "iPhone [0-9]+ Pro Max" | sort -Vr | head -1)
          if [ -z "$name" ]; then
            name=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+" | sort -Vr | head -1)
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Simulator: $name"

      - name: Build for simulator (compile)
        if: github.event_name == 'push' || github.event.inputs.action == 'compile'
        run: |
          set -euo pipefail
          xcodebuild build \
            -project FollowDeck.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -configuration Debug \
            -quiet

      - name: Run unit tests
        if: github.event_name == 'push' || github.event.inputs.action == 'compile'
        run: |
          set -euo pipefail
          xcodebuild test \
            -project FollowDeck.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -configuration Debug

      # --- Signing, archive, export and TestFlight upload (dry_run / release) ---
      # Route B (default): the runner only imports a pre-made .p12 + App Store profile; it
      # never mints a distribution certificate (orphaned certs consume the account limit).
      # Route A fallback keeps only the three ASC_* secrets and signs via
      # -allowProvisioningUpdates. Full material/source steps: docs/signing-runbook.md §2/§5/§6/§7/§8.
      # NOTE: this lane has not been run on a real Mac yet. First external run is dry_run;
      # calibrate profile UUID / action inputs against the runner output before enabling release.
      - name: Verify signing secrets (Route B)
        if: contains(fromJSON('["dry_run","release"]'), github.event.inputs.action)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
          PROVISIONING_PROFILE_WIDGET: ${{ secrets.PROVISIONING_PROFILE_WIDGET }}
        run: |
          set -euo pipefail
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT DIST_CERT_P12 DIST_CERT_PASSWORD PROVISIONING_PROFILE PROVISIONING_PROFILE_WIDGET; do
            if [ -z "${!v:-}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing Route B signing secrets:$missing. Provision per docs/signing-runbook.md, or switch to Route A."
            exit 1
          fi
          echo "All Route B signing secrets present."

      - name: Prepare signing material
        id: prepare
        if: contains(fromJSON('["dry_run","release"]'), github.event.inputs.action)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
          PROVISIONING_PROFILE_WIDGET: ${{ secrets.PROVISIONING_PROFILE_WIDGET }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/private_keys" "$HOME/Library/MobileDevice/Provisioning Profiles"

          # ASC API key (.p8, raw PKCS8 PEM) — kept on disk only for Route A automatic
          # provisioning; the TestFlight upload passes the key inline to the action.
          echo "$ASC_KEY_CONTENT" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          # Distribution .p12 into a throwaway keychain; partition list prevents a hanging
          # codesign prompt.
          echo "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "$DIST_CERT_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$DIST_CERT_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$DIST_CERT_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

          # App Store profiles: one for the main app, one for the widget extension. Each is
          # decoded, its UUID resolved, and installed under the profiles directory.
          install_profile() {
            local b64="$1" out="$2" uuid_var="$3"
            echo "$b64" | base64 --decode > "$out"
            local uuid
            uuid=$(security cms -D -i "$out" | plutil -extract UUID raw -)
            cp "$out" "$HOME/Library/MobileDevice/Provisioning Profiles/${uuid}.mobileprovision"
            echo "${uuid_var}=${uuid}" >> "$GITHUB_OUTPUT"
            echo "Installed profile $uuid_var: $uuid"
          }
          install_profile "$PROVISIONING_PROFILE" "$RUNNER_TEMP/profile.mobileprovision" "profile_uuid"
          install_profile "$PROVISIONING_PROFILE_WIDGET" "$RUNNER_TEMP/profile_widget.mobileprovision" "profile_uuid_widget"
          echo "Prepared signing material."

      - name: Archive Release build
        if: contains(fromJSON('["dry_run","release"]'), github.event.inputs.action)
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild archive \
            -project FollowDeck.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/FollowDeck.xcarchive" \
            DEVELOPMENT_TEAM=98KA35Y747 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Export IPA (App Store)
        if: contains(fromJSON('["dry_run","release"]'), github.event.inputs.action)
        env:
          PROFILE_UUID: ${{ steps.prepare.outputs.profile_uuid }}
          PROFILE_UUID_WIDGET: ${{ steps.prepare.outputs.profile_uuid_widget }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/ExportOptions.plist" "$PROFILE_UUID" "$PROFILE_UUID_WIDGET" <<'PY'
          import sys, plistlib
          path, uuid, uuid_widget = sys.argv[1], sys.argv[2], sys.argv[3]
          data = {
              "method": "app-store",
              "teamID": "98KA35Y747",
              "compileBitcode": False,
              "provisioningProfiles": {
                  "com.lixing.followdeck": uuid,
                  "com.lixing.followdeck.widget": uuid_widget,
              },
          }
          with open(path, "wb") as f:
              plistlib.dump(data, f)
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FollowDeck.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          # The upload action does not expand globs: point it at the concrete exported IPA.
          ls -la "$RUNNER_TEMP/ipa"
          test -f "$RUNNER_TEMP/ipa/FollowDeck.ipa" || { echo "::error::FollowDeck.ipa not exported to $RUNNER_TEMP/ipa"; exit 1; }

      - name: Verify exported binary (SDK + build number + icon)
        if: contains(fromJSON('["dry_run","release"]'), github.event.inputs.action)
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/unpacked/Payload/FollowDeck.app"
          rm -rf "$RUNNER_TEMP/unpacked"; mkdir -p "$RUNNER_TEMP/unpacked"
          unzip -q "$RUNNER_TEMP/ipa/FollowDeck.ipa" -d "$RUNNER_TEMP/unpacked"
          test -d "$APP" || { echo "::error::No Payload/FollowDeck.app in IPA"; exit 1; }

          VERSION=$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist")
          BUILD=$(plutil -extract CFBundleVersion raw "$APP/Info.plist")
          SDK_NAME=$(plutil -extract DTSDKName raw "$APP/Info.plist" 2>/dev/null || echo unknown)
          echo "IPA: version $VERSION build $BUILD, $SDK_NAME"
          EXPECTED_BUILD=$(sed -E -n 's/^[[:space:]]*CURRENT_PROJECT_VERSION:[[:space:]]*"([0-9]+)".*/\1/p' "$GITHUB_WORKSPACE/project.yml")
          test -n "$EXPECTED_BUILD" || { echo "::error::Could not read CURRENT_PROJECT_VERSION from project.yml"; exit 1; }
          test "$BUILD" = "$EXPECTED_BUILD" || { echo "::error::Expected build $EXPECTED_BUILD, got $BUILD"; exit 1; }
          case "$SDK_NAME" in
            iphoneos27*|iphoneos28*|iphoneos29*) ;;
            *) echo "::error::IPA was linked against $SDK_NAME (ITMS-90725 needs ios27+)"; exit 1 ;;
          esac

          # Large icon inside the bundle must be alpha-free (asset catalog output).
          python3 - "$APP" <<'PY'
          import glob, struct, sys, os
          app = sys.argv[1]
          pngs = [p for p in glob.glob(os.path.join(app, "AppIcon*.png"))] or \
                 [p for p in glob.glob(os.path.join(app, "*.png")) if "Icon" in os.path.basename(p)]
          print("icon candidates:", [os.path.basename(p) for p in pngs])
          for p in pngs:
              data = open(p, "rb").read()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  continue
              ct = struct.unpack(">IIBB", data[16:26])[3]
              if ct in (4, 6) or b"tRNS" in data:
                  sys.exit(f"::error::{os.path.basename(p)} still carries alpha (ITMS-90717)")
          print("Bundle icons: no alpha channel")
          PY

      # Only dry_run re-uploads to TestFlight. release reuses the VALID build already
      # associated with the in-flight App Store version; re-uploading the same bundle
      # version is rejected with 409 ("bundle version must be higher") and is redundant
      # for a review submission. release goes straight to the REST submit step below.
      - name: Upload to TestFlight
        if: github.event.inputs.action == 'dry_run'
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ runner.temp }}/ipa/FollowDeck.ipa
          app-type: ios
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_KEY_CONTENT }}
          uses-non-exempt-encryption: 'false'
          # Skip processing wait until Test Information (beta description, feedback email,
          # primary locale) and internal groups are configured in ASC.
          wait-for-processing: 'false'

      # dry_run stops after this TestFlight upload. release skips the re-upload (build 4 is
      # already VALID and associated with the in-flight version) and submits the App Store
      # version to review through the ASC REST API. This step never runs on push / compile /
      # dry_run; it stays behind the manual `action=release` dispatch.
      # Preconditions are assembled in the ASC web first (see docs/signing-runbook.md §8.1).
      - name: Submit for review (release only)
        if: github.event.inputs.action == 'release'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_APP_ID: "6838357401"
        run: python3 Scripts/asc_submit.py
